# Removes JWT_SECRET_PREVIOUS from Railway once it's at least 24h old, so a
# secret rotated via scripts/rotate-jwt-secret.ps1 doesn't stay accepted
# indefinitely. Safe by design: it only ever deletes JWT_SECRET_PREVIOUS
# and JWT_SECRET_ROTATED_AT, and no-ops whenever it can't prove the age
# (missing timestamp, not old enough yet).
#
# Setup required before this can run for real:
#   - Add a Railway project token as the RAILWAY_TOKEN repo secret.
#   - Set the RAILWAY_SERVICE / RAILWAY_ENVIRONMENT repo variables (Settings
#     > Secrets and variables > Actions > Variables) to match your Railway
#     service/environment names. Defaults below are placeholders.
#   - Run this workflow manually (Actions tab > this workflow > Run workflow)
#     with dry_run=true first to confirm it reads Railway variables correctly.

name: JWT secret rotation cleanup

on:
  schedule:
    - cron: "0 * * * *" # hourly; the age check makes this safe to run often
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen without deleting anything"
        type: boolean
        default: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'granary' }}
  TARGET_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
  MIN_AGE_SECONDS: 86400 # 24h

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: bash <(curl -fsSL railway.com/install.sh) -y

      - name: Check age and clean up JWT_SECRET_PREVIOUS
        run: |
          set -euo pipefail

          VARS_JSON=$(railway variable list --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT" --json)

          PREVIOUS=$(echo "$VARS_JSON" | jq -r '.JWT_SECRET_PREVIOUS // empty')
          ROTATED_AT=$(echo "$VARS_JSON" | jq -r '.JWT_SECRET_ROTATED_AT // empty')

          if [ -z "$PREVIOUS" ]; then
            echo "No JWT_SECRET_PREVIOUS set. Nothing to clean up."
            exit 0
          fi

          if [ -z "$ROTATED_AT" ]; then
            echo "JWT_SECRET_PREVIOUS is set but JWT_SECRET_ROTATED_AT is missing, so its age can't be verified. Skipping rather than deleting blindly."
            exit 0
          fi

          NOW=$(date -u +%s)
          AGE=$(( NOW - ROTATED_AT ))
          echo "JWT_SECRET_PREVIOUS is ${AGE}s old (threshold: ${MIN_AGE_SECONDS}s)."

          if [ "$AGE" -lt "$MIN_AGE_SECONDS" ]; then
            echo "Not old enough yet. Skipping."
            exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: would delete JWT_SECRET_PREVIOUS and JWT_SECRET_ROTATED_AT now."
            exit 0
          fi

          echo "Deleting JWT_SECRET_PREVIOUS and JWT_SECRET_ROTATED_AT."
          yes | railway variable delete JWT_SECRET_PREVIOUS --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT"
          yes | railway variable delete JWT_SECRET_ROTATED_AT --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT"
          echo "Done."
