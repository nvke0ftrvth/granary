spring.application.name=granary

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8080}
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${APP_FRONTEND_BASE_URL}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# Multipart upload limits (must be >= RecipeService.MAX_IMAGE_SIZE_BYTES)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=6MB

logging.level.root=INFO
logging.level.com.example.granary=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.show-sql=false