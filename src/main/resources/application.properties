spring.application.name=granary

spring.datasource.url=jdbc:postgresql://localhost:5432/granary
spring.datasource.username=granary
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET:}
app.jwt.secret.previous=${JWT_SECRET_PREVIOUS:}
app.jwt.expiration=86400000

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
 
app.upload.dir=uploads/recipe-images
app.cors.allowed-origins=http://localhost:5173
app.frontend.base-url=http://localhost:5173
app.dev.fallback-username=testuser

logging.level.root=INFO
logging.level.com.example.granary=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE